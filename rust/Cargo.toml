[package]
name = "mcp-serve-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Shared native-MCP serving core for tool servers"
license = "MIT"
repository = "https://github.com/beantownbytes/mcp-serve-core"
readme = "../README.md"
keywords = ["mcp", "mcp-server", "server", "stdio", "rmcp"]
categories = ["development-tools", "asynchronous"]
exclude = ["Makefile", "rust-toolchain.toml"]

[lib]
path = "src/lib.rs"

[features]
testing = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
rmcp = { version = "=3.10.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std"] }
toml = "0.8"

[[test]]
name = "serve_stdio"
required-features = ["testing"]
